name: Weekly GitHub Release

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Base image tag to scan (default: tag pinned in dockerfiles/bases/skaffold.yaml)"
        required: false
        type: string

# Ensure only one instance of this workflow runs at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-tags: true
          # Fetch all history for proper comparison
          fetch-depth: 0

      - name: Check for changes since last release
        id: check-changes
        run: |
          # Get the latest release tag
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName --jq .[].tagName)

          if [ -z "$LATEST_RELEASE" ]; then
            echo "No previous releases found. Creating initial release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest release: $LATEST_RELEASE"

            # Check if there are any changes since the latest release
            CHANGES=$(git log "${LATEST_RELEASE}..HEAD" --oneline)

            if [ -n "$CHANGES" ]; then
              echo "Changes detected since last release"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes since last release"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date
        if: steps.check-changes.outputs.has_changes == 'true'
        id: date
        run: echo "date=$(date +'%Y.%-m.%-d')" >> "$GITHUB_OUTPUT"

      - name: Create new tag and release
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail

          TAG_NAME="v${{ steps.date.outputs.date }}"

          # Delete remote tag if it exists to handle re-runs
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" \
            >/dev/null 2>&1 || true

          # Create a new annotated tag
          TAG_SHA=$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG_NAME" \
            -f message="Weekly release $TAG_NAME" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)

          # Push the tag ref
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TAG_SHA"

          # Create GitHub release
          gh release create "$TAG_NAME" \
            --title "Weekly Release $TAG_NAME" \
            --notes "Weekly automatic release created on $(date +'%Y-%m-%d')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to open/update/close the weekly scan issue.
      issues: write
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Resolve base image tag
        id: tag
        working-directory: dockerfiles/bases
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            tag="${INPUT_IMAGE_TAG}"
            echo "Using image_tag from workflow_dispatch: ${tag}"
          else
            tag=$(yq 'select(.metadata.name == "default") | .build.tagPolicy.customTemplate.template' skaffold.yaml)
          fi
          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "::error::Could not resolve the base image tag (skaffold.yaml or image_tag input)"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install trivy from official APT repo
        run: |
          sudo apt-get update && sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      # Policy: HIGH + CRITICAL, unfixed included (2026-10-26 owner decision).
      # The script exits 2 when any image could not be scanned, so registry or
      # Trivy DB failures never masquerade as vulnerability findings.
      - name: Scan base images and build report
        id: scan
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          .github/scripts/scan-base-images.sh \
            --tag "${IMAGE_TAG}" \
            --output-dir "${RUNNER_TEMP}/weekly-scan"

      - name: Publish scan report to the job summary
        if: always() && steps.scan.outputs.report_file != ''
        env:
          REPORT_FILE: ${{ steps.scan.outputs.report_file }}
        run: cat "${REPORT_FILE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report artifact
        if: always() && steps.scan.outputs.report_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-scan-${{ steps.tag.outputs.tag }}
          path: ${{ runner.temp }}/weekly-scan
          retention-days: 30
          if-no-files-found: error

      - name: Send scan report via email
        if: always() && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@47af4a10b540781705f283a2cf1a9650713ac795 # v23
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          to: ci@pingcap.com
          from: GitHub Actions <actions@github.com>
          subject: Weekly Trivy scan report - bases (default)
          body: |
            Weekly vulnerability scan completed for base images (tag: ${{ steps.tag.outputs.tag }}).

            HIGH/CRITICAL findings: ${{ steps.scan.outputs.critical }} critical, ${{ steps.scan.outputs.high }} high.
            Report artifact: weekly-scan-${{ steps.tag.outputs.tag }}
            See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Open or update the weekly scan issue
        if: steps.scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          TOTAL: ${{ steps.scan.outputs.total }}
          CRITICAL: ${{ steps.scan.outputs.critical }}
          HIGH: ${{ steps.scan.outputs.high }}
          REPORT_FILE: ${{ steps.scan.outputs.report_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Idempotent: create the labels once, reuse them afterwards.
          gh label create security --color 0E8A16 --description "Security-related findings" --force >/dev/null
          gh label create weekly-scan --color B60205 --description "Automated weekly base image scan" --force >/dev/null

          if [ "${TOTAL}" -eq 0 ]; then
            closed=0
            while IFS= read -r number; do
              [ -n "${number}" ] || continue
              gh issue close "${number}" \
                --comment "Clean weekly scan for base images tag \`${IMAGE_TAG}\`: 0 HIGH/CRITICAL findings. Closing automatically. Run: ${RUN_URL}"
              closed=$((closed + 1))
            done < <(gh issue list --label weekly-scan --state open --limit 100 --json number --jq '.[].number')
            echo "No HIGH/CRITICAL findings; closed ${closed} resolved weekly-scan issue(s)."
            exit 0
          fi

          body_file="${RUNNER_TEMP}/weekly-scan/issue-body.md"
          mkdir -p "$(dirname "${body_file}")"
          {
            cat "${REPORT_FILE}"
            echo
            echo "## Suggested actions"
            echo
            echo "- Rebuild the base images with refreshed packages (same flow as the recent \`fix(bases): refresh packages ...\` PRs)."
            echo "- Re-run the \`Weekly GitHub Release\` workflow with \`image_tag\` set to an older tag to reproduce a finding."
            echo "- This issue is closed automatically the next time a scan reports 0 HIGH/CRITICAL findings."
          } > "${body_file}"

          title="[weekly-scan] HIGH/CRITICAL vulnerabilities in base images (${IMAGE_TAG})"
          existing=$(gh issue list \
            --label weekly-scan \
            --state open \
            --limit 100 \
            --json number,title |
            jq -r --arg title "${title}" '.[] | select(.title == $title) | .number' |
            head -n 1)

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --body-file "${body_file}"
            echo "Updated existing weekly scan issue #${existing}"
          else
            gh issue create \
              --title "${title}" \
              --body-file "${body_file}" \
              --label security \
              --label weekly-scan
          fi

          echo "::notice::${CRITICAL} CRITICAL and ${HIGH} HIGH findings recorded for tag ${IMAGE_TAG}"

      # Keep this step after the issue step: the issue is the durable signal,
      # so the job must not fail before it is written.
      - name: Fail when HIGH/CRITICAL vulnerabilities are found
        if: steps.scan.outcome == 'success' && steps.scan.outputs.total != '0'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          CRITICAL: ${{ steps.scan.outputs.critical }}
          HIGH: ${{ steps.scan.outputs.high }}
        run: |
          echo "::error::Base images tag ${IMAGE_TAG} has ${CRITICAL} CRITICAL and ${HIGH} HIGH vulnerabilities; see the weekly-scan issue and report artifact."
          exit 1

      - name: Notify email report skipped
        if: always() && env.SMTP_SERVER == ''
        run: |
          echo "::warning::SMTP_SERVER secret is not configured; scan report email skipped. Set SMTP_SERVER / SMTP_USERNAME / SMTP_PASSWORD repo secrets to enable email delivery."
