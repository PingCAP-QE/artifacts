name: Publish product base images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dockerfiles/bases/**/Dockerfile"
      - "dockerfiles/bases/**/*.Dockerfile"
      - "dockerfiles/bases/skaffold.yaml"
      - "!dockerfiles/bases/alpine-glibc/**"

permissions:
  contents: read

jobs:
  skaffold:
    name: publish images with skaffold
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        module: [default, release-6-5]

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: "0"
          fetch-tags: "true"

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup skaffold
        uses: heypigeonhq/setup-skaffold@3b1a0687de1b580d3879bf6b9d423255c9954587
        with:
          version: 2.23.0

      # Required by dockerfiles/bases/build-old.sh, which composes the
      # multi-arch manifest with manifest-tool when pushing the release-6-5
      # module images. Keep in sync with pull-prod-runtime-images.yaml.
      - name: Setup manifest-tool
        run: |
          curl -L https://github.com/estesp/manifest-tool/releases/download/v2.1.7/binaries-manifest-tool-2.1.7.tar.gz | tar -zxvf - manifest-tool-linux-amd64
          sudo install manifest-tool-linux-amd64 /usr/local/bin/manifest-tool

      - name: Cache layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: "~/.skaffold/cache"
          key: skaffold/prod-bases-${{ github.sha }}
          restore-keys: |
            skaffold/prod-bases-

      # The default module derives its tag from `git describe`, so a re-run of
      # this workflow would push the same tag with a different digest (the
      # build refreshes packages with `dnf upgrade`). Treat the tag as
      # immutable: resolve it once, and skip the push when every image already
      # has it. Republishing refreshed packages requires a new commit (e.g. a
      # `_date` bump), which yields a new tag.
      - name: Resolve tag and check for published images
        if: matrix.module == 'default'
        id: check
        env:
          TAGS_FILE: ${{ runner.temp }}/base-image-tags.json
        run: |
          set -euo pipefail

          skaffold build \
            --dry-run \
            --module default \
            --default-repo ghcr.io/pingcap-qe/bases \
            --file-output "${TAGS_FILE}" > /dev/null

          mapfile -t refs < <(jq -r '.builds[].tag' "${TAGS_FILE}")
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "ERROR: skaffold did not resolve any image tags" >&2
            exit 1
          fi

          tag="${refs[0]##*:}"
          for ref in "${refs[@]}"; do
            if [ "${ref##*:}" != "${tag}" ]; then
              echo "ERROR: artifacts do not share one tag: ${ref}" >&2
              exit 1
            fi
          done

          missing=0
          for ref in "${refs[@]}"; do
            if docker buildx imagetools inspect "${ref}" > /dev/null 2>&1; then
              echo "already published: ${ref}"
            else
              echo "not published yet: ${ref}"
              missing=$((missing + 1))
            fi
          done

          if [ "${missing}" -eq 0 ]; then
            echo "::notice::All base images are already published under ${tag}; skipping the build to keep the tag immutable."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish images
        if: matrix.module != 'default' || steps.check.outputs.built == 'true'
        working-directory: dockerfiles/bases
        env:
          MODULE: ${{ matrix.module }}
          RESOLVED_TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          args=(
            --build-concurrency 1
            --default-repo ghcr.io/pingcap-qe/bases
            --module "${MODULE}"
          )
          if [ "${MODULE}" = "default" ]; then
            # Build exactly the tag that was checked above, so a weekly release
            # tag created mid-run cannot shift it.
            args+=(--tag "${RESOLVED_TAG}")
          fi
          skaffold build "${args[@]}"

      - name: Install trivy from official APT repo
        if: matrix.module == 'default'
        run: |
          sudo apt-get update && sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      # Same severity policy as the weekly scan (HIGH + CRITICAL, unfixed
      # included) so a green weekly run can never contradict a red publish.
      # Runs even when the build was skipped, so an existing tag is still gated.
      - name: Scan base images for HIGH/CRITICAL vulnerabilities
        if: matrix.module == 'default'
        env:
          IMAGE_TAG: ${{ steps.check.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/base-image-scan"
          .github/scripts/scan-base-images.sh \
            --tag "${IMAGE_TAG}" \
            --output-dir "${out_dir}"
          cat "${out_dir}/scan-report.md" >> "$GITHUB_STEP_SUMMARY"
          total=$(jq -r '.totals.critical + .totals.high' "${out_dir}/scan-summary.json")
          if [ "${total}" -gt 0 ]; then
            echo "::error::${total} HIGH/CRITICAL vulnerabilities found in base images tag ${IMAGE_TAG}; see the scan report above."
            exit 1
          fi
