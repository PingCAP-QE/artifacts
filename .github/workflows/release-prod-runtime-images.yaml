name: Publish product base images
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dockerfiles/bases/**/Dockerfile"
      - "dockerfiles/bases/**/*.Dockerfile"
      - "dockerfiles/bases/skaffold.yaml"

permissions:
  contents: read

jobs:
  skaffold:
    name: publish images with skaffold
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        module: [default, release-6-5]

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: "0"
          fetch-tags: "true"

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup skaffold
        uses: heypigeonhq/setup-skaffold@3b1a0687de1b580d3879bf6b9d423255c9954587
        with:
          version: 2.23.0

      - name: Setup manifest-tool
        run: |
          curl -L https://github.com/estesp/manifest-tool/releases/download/v2.1.7/binaries-manifest-tool-2.1.7.tar.gz | tar -zxvf - manifest-tool-linux-amd64
          sudo install manifest-tool-linux-amd64 /usr/local/bin/manifest-tool

      - name: Cache layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: "~/.skaffold/cache"
          key: skaffold/prod-bases-${{ github.sha }}
          restore-keys: |
            skaffold/prod-bases-

      - name: Publish images
        working-directory: dockerfiles/bases
        run: |
          skaffold build \
            --build-concurrency 1 \
            --default-repo ghcr.io/pingcap-qe/bases \
            --module ${{ matrix.module }}

      - name: Get image tag from skaffold
        if: matrix.module == 'default'
        id: tag
        working-directory: dockerfiles/bases
        run: |
          tag=$(yq 'select(.metadata.name == "default") | .build.tagPolicy.customTemplate.template' skaffold.yaml)
          if [ -z "${tag}" ]; then
            echo "ERROR: could not extract image tag from skaffold.yaml" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set image version labels
        if: matrix.module == 'default'
        run: |
          set -euo pipefail
          GOBIN=/usr/local/bin go install github.com/google/go-containerregistry/cmd/crane@v0.21.9
          images="pingcap-base pd-base tikv-base tidb-base ng-monitoring-base tiflash-base tools-base"
          for img in $images; do
            crane mutate "ghcr.io/pingcap-qe/bases/${img}:${{ steps.tag.outputs.tag }}" \
              --label "org.opencontainers.image.version=${{ steps.tag.outputs.tag }}" \
              --label "version=${{ steps.tag.outputs.tag }}"
          done

      - name: Install trivy from official APT repo
        if: matrix.module == 'default'
        run: |
          sudo apt-get update && sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner on base images
        if: matrix.module == 'default'
        run: |
          images="pingcap-base pd-base tikv-base tidb-base ng-monitoring-base tiflash-base tools-base"
          has_vulns=false
          for img in $images; do
            echo "=== Scanning $img ==="
            output=$(trivy image \
              --format table \
              "ghcr.io/pingcap-qe/bases/${img}:${{ steps.tag.outputs.tag }}" || true)
            echo "$output"
            if echo "$output" | grep -q '^Total:'; then
              has_vulns=true
            fi
          done
          if [ "$has_vulns" = true ]; then
            echo "Vulnerabilities found in base images. Check scan results above."
            exit 1
          fi
