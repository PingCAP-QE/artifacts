# Source of truth for the alpine-glibc matrix.
#
# Phase 1 only publishes Alpine 3.22. To add 3.23/3.24, append them to
# `alpine` and run `make generate` (Dockerfile and profiles stay unchanged).
#
# glibc sources:
#   2.30-2.35: frolvlad donor image (sgerrand recipe), amd64 only.
#              Pinned by digest; the tag is kept for readability.
#   2.36-2.44: dalet-oss/alpine-glibc signed APK releases, amd64 + arm64.
#              The 2.44 release tag has a -r1 suffix; the build target
#              handles it based on `version`.

alpine:
  - "3.22"

glibc:
  - version: "2.30"
    target: donor
    donor: "frolvlad/alpine-glibc:alpine-3.11_glibc-2.30@sha256:b6165080982253b82ad8e0a782ba2b56309909de48f617fbff1aa2867408c787"
    platforms:
      - linux/amd64
