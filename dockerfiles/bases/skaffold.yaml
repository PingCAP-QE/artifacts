# Ref: https://skaffold.dev/docs/builders/builder-types/docker
apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: default
build:
  artifacts:
    - image: pingcap-base
      platforms: [linux/amd64, linux/arm64]
      docker:
        dockerfile: pingcap-base/Dockerfile
    - image: pd-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: pd-base/Dockerfile
    - image: ng-monitoring-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: ng-monitoring-base/Dockerfile
    - image: tidb-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tidb-base/Dockerfile
    - image: tiflash-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tiflash-base/Dockerfile
    - image: tikv-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tikv-base/Dockerfile
    - image: tools-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tools-base/Dockerfile
    - image: debugging
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: debugging/Dockerfile
  tagPolicy:
    envTemplate:
      # `git describe --tags --always` yields `v2026.11.27-2-ge5c763a`.
      # Turn that into strict semver:
      #   - drop the `v` prefix (semver forbids it);
      #   - replace `-g` with `.g` so the distance is its own numeric
      #     prerelease identifier and compares numerically (`-10.` > `-2.`)
      #     instead of lexically (`-2-` > `-10-`).
      # Result: `2026.11.27-2.ge5c763a`; an exact tag yields `2026.11.27`.
      template: '{{ $d := cmd "bash" "-c" "git describe --tags --always" }}{{ replace "-g" ".g" (trimPrefix "v" $d) }}'
  local:
    useDockerCLI: true
    useBuildkit: true
    concurrency: 0
    tryImportMissing: true

---
apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: release-6-5
build:
  artifacts:
    - image: ng-monitoring-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh ng-monitoring-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: ng-monitoring-base/release-6.5.Dockerfile
    - image: pd-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh pd-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: pd-base/release-6.5.Dockerfile
    - image: tidb-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tidb-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tidb-base/release-6.5.Dockerfile
    - image: tiflash-base
      platforms: [linux/amd64, linux/arm64]
      docker:
        dockerfile: tiflash-base/release-6.5.Dockerfile
        noCache: false
        pullParent: false
        squash: false
    - image: tiflow-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tiflow-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tiflow-base/release-6.5.Dockerfile
    - image: tikv-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tikv-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tikv-base/release-6.5.Dockerfile
    - image: tools-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tools-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tools-base/release-6.5.Dockerfile
  tagPolicy:
    customTemplate:
      template: "v1.0.2-old"
  local:
    useDockerCLI: true
    useBuildkit: true
    concurrency: 0
    tryImportMissing: true
