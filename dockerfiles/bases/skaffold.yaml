# Ref: https://skaffold.dev/docs/builders/builder-types/docker
apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: default
build:
  artifacts:
    - image: pingcap-base
      platforms: [linux/amd64, linux/arm64]
      docker:
        dockerfile: pingcap-base/Dockerfile
    - image: pd-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: pd-base/Dockerfile
    - image: ng-monitoring-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: ng-monitoring-base/Dockerfile
    - image: tidb-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tidb-base/Dockerfile
    - image: tiflash-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tiflash-base/Dockerfile
    - image: tikv-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tikv-base/Dockerfile
    - image: tools-base
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: tools-base/Dockerfile
    - image: debugging
      platforms: [linux/amd64, linux/arm64]
      requires:
        - image: pingcap-base
          alias: PINGCAP_BASE
      docker:
        dockerfile: debugging/Dockerfile
  tagPolicy:
    envTemplate:
      # Valid semver tag derived from git:
      #   v1.<commits reachable from HEAD>.0-<short commit sha>
      # - the commit count keeps the minor version monotonic on main, so
      #   Renovate and other version-aware tooling can order the tags;
      # - the short sha is the semver prerelease component, so the tag still
      #   points at the exact build commit and is never reused;
      # - `git` runs in the skaffold working directory (dockerfiles/bases),
      #   which resolves to this repository.
      template: 'v1.{{ cmd "git" "rev-list" "--count" "HEAD" }}.0-{{ cmd "git" "rev-parse" "--short" "HEAD" }}'
  local:
    useDockerCLI: true
    useBuildkit: true
    concurrency: 0
    tryImportMissing: true

---
apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: release-6-5
build:
  artifacts:
    - image: ng-monitoring-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh ng-monitoring-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: ng-monitoring-base/release-6.5.Dockerfile
    - image: pd-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh pd-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: pd-base/release-6.5.Dockerfile
    - image: tidb-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tidb-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tidb-base/release-6.5.Dockerfile
    - image: tiflash-base
      platforms: [linux/amd64, linux/arm64]
      docker:
        dockerfile: tiflash-base/release-6.5.Dockerfile
        noCache: false
        pullParent: false
        squash: false
    - image: tiflow-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tiflow-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tiflow-base/release-6.5.Dockerfile
    - image: tikv-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tikv-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tikv-base/release-6.5.Dockerfile
    - image: tools-base
      platforms: [linux/amd64, linux/arm64]
      custom:
        buildCommand: ./build-old.sh tools-base release-6.5.Dockerfile
        dependencies:
          dockerfile:
            path: tools-base/release-6.5.Dockerfile
  tagPolicy:
    customTemplate:
      template: "v1.0.2-old"
  local:
    useDockerCLI: true
    useBuildkit: true
    concurrency: 0
    tryImportMissing: true
